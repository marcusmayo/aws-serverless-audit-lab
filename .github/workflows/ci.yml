name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aws-serverless-audit-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install deterministic toolchain
        run: python -m pip install --requirement requirements-dev.txt

      - name: Validate Codespaces configuration
        run: python -m json.tool .devcontainer/devcontainer.json > /dev/null

      - name: Lint Python
        run: ruff check audit preview src tests

      - name: Run tests and coverage gate
        run: pytest --cov=audit --cov=src --cov-report=term-missing --cov-report=xml

      - name: Lint SAM and CloudFormation
        run: cfn-lint template.yaml

      - uses: aws-actions/setup-sam@v2

      - name: Validate SAM transform
        run: sam validate --lint --template-file template.yaml

      - name: Build Lambda artifacts
        run: sam build --cached --template-file template.yaml

      - name: Audit the reference architecture
        run: python -m audit.audit_template template.yaml --format markdown

      - name: Run deterministic regression oracle
        run: python -m audit.oracle

      - name: Verify clean Codespaces preview bootstrap
        env:
          VENV_DIR: ${{ runner.temp }}/audit-preview-venv
        run: |
          set -euo pipefail
          trap 'make preview-stop 2>/dev/null || true' EXIT
          make preview-start
          make preview-start
          "${VENV_DIR}/bin/python" - <<'PY'
          import json
          from pathlib import Path
          from urllib.request import Request, urlopen

          base_url = "http://127.0.0.1:8000"

          def get(path: str) -> tuple[int, str, bytes]:
              with urlopen(base_url + path, timeout=3) as response:
                  return response.status, response.headers.get_content_type(), response.read()

          def post(path: str, payload: dict[str, object]) -> dict[str, object]:
              request = Request(
                  base_url + path,
                  data=json.dumps(payload).encode(),
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              with urlopen(request, timeout=5) as response:
                  return json.load(response)

          status, content_type, index = get("/")
          assert status == 200 and content_type == "text/html"
          assert b"AWS Serverless Audit Lab" in index and b"Run portfolio demo" in index
          for asset, expected_type in (("/app.js", "text/javascript"), ("/styles.css", "text/css")):
              asset_status, asset_type, body = get(asset)
              assert asset_status == 200 and asset_type == expected_type and body

          health = json.loads(get("/api/health")[2])
          assert health == {
              "mode": "STATIC_ONLY",
              "oracle_case_count": 3,
              "service": "aws-serverless-audit-lab",
              "status": "ok",
          }
          demo = json.loads(get("/api/demo")[2])
          assert demo["source"] == "portfolio-demo.yaml"
          assert demo["report"]["decision"] == "FAIL"
          assert demo["report"]["score"] == 16
          assert demo["report"]["finding_count"] == 6
          assert [finding["rule_id"] for finding in demo["report"]["findings"]] == [
              "IAM001",
              "API001",
              "IAM002",
              "SEC002",
              "COST001",
              "OBS001",
          ]
          audit = post(
              "/api/audit",
              {
                  "source": "ci-visible-preview.yaml",
                  "template": Path("task_cases/T01_iam_secret/template.yaml").read_text(),
              },
          )
          assert audit["finding_count"] >= 2
          assert {finding["rule_id"] for finding in audit["findings"]} >= {"IAM001", "SEC001"}
          oracle = post("/api/oracle/run", {})
          assert oracle["verdict"] == "MATCH" and oracle["matched_count"] == 3
          PY

      - name: Upload coverage evidence
        uses: actions/upload-artifact@v4
        with:
          name: aws-serverless-audit-lab-coverage
          path: coverage.xml
          retention-days: 14

  codespaces-container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build and exercise the Codespaces dev container
        uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: |
            sam --version
            make preview-status
            make oracle
